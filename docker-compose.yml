version: '3.8'

services:
  # Rundler service
  rundler:
    image: rundler:latest
    command: node --unsafe
    ports:
      - "8545:3000"
    environment:
      - RUST_LOG=INFO
      - NETWORK=ethereum_sepolia
      - NODE_HTTP=${NODE_HTTP}
      - SIGNER_PRIVATE_KEYS=${SIGNER_PRIVATE_KEYS}
      - DISABLE_ENTRY_POINT_V0_6=true
    env_file:
      - .env

  # Express server service
  express-server:
    build: .
    ports:
      - "${EXPRESS_PORT:-3001}:3000"
    environment:
      - RUNDLER_URL=http://rundler:3000
      - ETH_RPC_URL=${ETH_RPC_URL}
      - CHAIN_ID=${CHAIN_ID}
    env_file:
      - .env
    depends_on:
      - rundler